<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#F6F6F4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1B1B19" media="(prefers-color-scheme: dark)">
  <title>{% block title %}{{ site_title }}{% endblock %}</title>
  <link rel="preload" href="/static/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/style.css?v=8">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='7' y='3' width='18' height='24' rx='2' fill='%23fff' stroke='%2324231F' stroke-width='2'/%3E%3Crect x='11' y='9' width='10' height='2' fill='%230A7CC1'/%3E%3Crect x='11' y='14' width='10' height='2' fill='%2324231F' opacity='.35'/%3E%3Crect x='11' y='19' width='6' height='2' fill='%2324231F' opacity='.35'/%3E%3C/svg%3E">
</head>
<body class="{% block body_class %}{% endblock %}">
  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="i-logo" viewBox="0 0 24 24"><rect x="5" y="2.5" width="14" height="19" rx="1.8" fill="var(--paper)" stroke="currentColor" stroke-width="1.6"/><rect x="8" y="7" width="8" height="1.6" rx=".8" fill="var(--accent)"/><rect x="8" y="10.5" width="8" height="1.6" rx=".8" fill="currentColor" opacity=".3"/><rect x="8" y="14" width="5" height="1.6" rx=".8" fill="currentColor" opacity=".3"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4"/><path d="m7.5 8.5 4.5-4.5 4.5 4.5"/><path d="M5 14v4.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V14"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M6.5 3h7.5l4.5 4.5v12A1.5 1.5 0 0 1 17 21H6.5A1.5 1.5 0 0 1 5 19.5v-15A1.5 1.5 0 0 1 6.5 3Z"/><path d="M13.5 3v4.5H18"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 12h12"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 12h12M12 6v12"/></symbol>
    <symbol id="i-chev-l" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m14.5 6-6 6 6 6"/></symbol>
    <symbol id="i-chev-r" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9.5 6 6 6-6 6"/></symbol>
    <symbol id="i-flip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 13.7-5.6L20 8.5"/><path d="M20 4v4.5h-4.5"/><path d="M20 12a8 8 0 0 1-13.7 5.6L4 15.5"/><path d="M4 20v-4.5h4.5"/></symbol>
    <symbol id="i-simplex" viewBox="0 0 40 32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="12" y="4" width="16" height="22" rx="1.5" fill="var(--paper)"/><path d="M16 10h8M16 14h8M16 18h5" stroke-linecap="round" opacity=".5"/></symbol>
    <symbol id="i-duplex" viewBox="0 0 40 32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="15" y="2" width="16" height="22" rx="1.5" fill="var(--paper)" opacity=".9"/><rect x="9" y="7" width="16" height="22" rx="1.5" fill="var(--paper)"/><path d="M13 13h8M13 17h8M13 21h5" stroke-linecap="round" opacity=".5"/></symbol>
    <symbol id="i-duplex-long" viewBox="0 0 40 32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="5" y="4" width="14" height="22" rx="1.5" fill="var(--paper)"/><rect x="21" y="4" width="14" height="22" rx="1.5" fill="var(--paper)"/><path d="M20 3v24" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round"/><path d="M8.5 10h7M8.5 14h7M24.5 10h7M24.5 14h7" stroke-linecap="round" opacity=".5"/></symbol>
    <symbol id="i-duplex-short" viewBox="0 0 40 32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="11" y="2" width="18" height="13" rx="1.5" fill="var(--paper)"/><rect x="11" y="17" width="18" height="13" rx="1.5" fill="var(--paper)"/><path d="M10 16h20" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round"/><path d="M14.5 6.5h11M14.5 10h7M14.5 21.5h11M14.5 25h7" stroke-linecap="round" opacity=".5"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.3v.2"/></symbol>
    <symbol id="i-printer" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M7 8V3.5h10V8"/><rect x="3.5" y="8" width="17" height="8.5" rx="1.8"/><path d="M7 14h10v6.5H7z" fill="var(--paper)"/></symbol>
    <symbol id="i-logout" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4.5H6.5A1.5 1.5 0 0 0 5 6v12a1.5 1.5 0 0 0 1.5 1.5H14"/><path d="M10 12h10M16.5 8.5 20 12l-3.5 3.5"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="m7.5 10.5 4.5 4.5 4.5-4.5"/><path d="M5 19.5h14"/></symbol>
    <symbol id="i-retry" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3L4.5 9"/><path d="M4.5 4.5V9H9"/></symbol>
  </svg>

  {% block header %}{% endblock %}
  <main class="{% block main_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>
  <div class="toasts" id="toasts" aria-live="polite">
    {% for kind, msg in flashes %}
      <div class="toast {{ kind }}" role="status">
        <svg class="ic"><use href="#{{ 'i-alert' if kind == 'error' else 'i-check' }}"/></svg>
        <span>{{ msg }}</span>
      </div>
    {% endfor %}
  </div>
  <script src="/static/toast.js?v=3" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
