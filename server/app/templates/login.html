{% extends "base.html" %}
{% block title %}Anmelden – {{ site_title }}{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Anmelden</h1>
  <p class="muted">Den Zugangscode findest du am Drucker im Arbeitsraum.</p>
  <form method="post" action="/login">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Zugangscode
      <input name="code" type="password" autocomplete="current-password" required autofocus>
    </label>
    <label>Dein Name
      <input name="name" value="{{ name }}" maxlength="40" autocomplete="name" required
             placeholder="z. B. Alex M.">
    </label>
    <p class="hint">Der Name wird mit deinen Aufträgen im Druck-Log gespeichert (Papier- und Tonerverbrauch).</p>
    <button type="submit" class="primary">Anmelden</button>
  </form>
</section>
{% endblock %}
