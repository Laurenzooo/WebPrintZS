{% extends "base.html" %}
{% block title %}Anmelden – {{ site_title }}{% endblock %}
{% block body_class %}auth{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-art" aria-hidden="true">
    <div class="sheet-fan">
      <div class="fan-sheet a3"><span></span><span></span><span class="short"></span></div>
      <div class="fan-sheet a4 gray"><span></span><span></span><span></span><span class="short"></span></div>
      <div class="fan-sheet a5"><span class="accent"></span><span></span><span class="short"></span></div>
    </div>
  </div>
  <section class="auth-card">
    <div class="brand-row">
      <svg class="logo"><use href="#i-logo"/></svg>
      <span>{{ site_title }}</span>
    </div>
    <h1>Vom Platz aus drucken</h1>
    <form method="post" action="/login" class="stack">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <div class="field">
        <label for="code">Zugangscode</label>
        <input id="code" name="code" type="password" autocomplete="current-password" required autofocus>
        <p class="help">Hängt am Drucker aus.</p>
      </div>
      <div class="field">
        <label for="name">Dein Name</label>
        <input id="name" name="name" value="{{ name }}" maxlength="40" autocomplete="name" required placeholder="Alex M.">
        <p class="help">Steht im Druckprotokoll, damit der Verbrauch nachvollziehbar bleibt.</p>
      </div>
      <button type="submit" class="btn btn-primary btn-lg">Anmelden</button>
    </form>
  </section>
</div>
{% endblock %}
