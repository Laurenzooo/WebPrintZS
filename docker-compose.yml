# Für Coolify: "Docker Compose" als Build Pack wählen, Domain auf Service "web" Port 8000 legen.
# Lokal: cp .env.example .env && docker compose up --build
services:
  web:
    build: ./server
    restart: unless-stopped
    environment:
      ACCESS_CODE: ${ACCESS_CODE:?ACCESS_CODE fehlt}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD fehlt}
      AGENT_TOKEN: ${AGENT_TOKEN:?AGENT_TOKEN fehlt}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY fehlt}
      SITE_TITLE: ${SITE_TITLE:-Druckdienst}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      MAX_PAGES: ${MAX_PAGES:-300}
      MAX_COPIES: ${MAX_COPIES:-20}
      RATE_LIMIT_JOBS_PER_HOUR: ${RATE_LIMIT_JOBS_PER_HOUR:-20}
      MAX_PAGES_PER_DAY: ${MAX_PAGES_PER_DAY:-0}
      JOB_EXPIRE_HOURS: ${JOB_EXPIRE_HOURS:-12}
      PRINTING_TIMEOUT_MIN: ${PRINTING_TIMEOUT_MIN:-15}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-365}
      FORMATS: ${FORMATS:-A4,A3,A5}
      DUPLEX_FORMATS: ${DUPLEX_FORMATS:-A4,A3,A5}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    volumes:
      - druckdienst-data:/data
    ports:
      - "8000"   # Coolify/Traefik routet auf diesen Port; lokal ggf. "8000:8000"

volumes:
  druckdienst-data:
